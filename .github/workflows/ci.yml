name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (no API calls, providers are mocked)
        run: pytest -q
      - name: Eval on the bundled examples (demo mode)
        run: python evals/run_eval.py
      - name: Demo run
        run: discovery-agent demo --out /tmp/report.md
