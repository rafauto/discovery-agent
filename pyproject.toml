[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "discovery-agent"
version = "0.1.0"
description = "An AI agent for Product Owners: turns interview transcripts and user feedback into pains, opportunities and user stories."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Rafaela Uto" }]
dependencies = [
    "pydantic>=2.6",
    "anthropic>=0.40",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
app = ["streamlit>=1.46"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
discovery-agent = "discovery_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/discovery_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
